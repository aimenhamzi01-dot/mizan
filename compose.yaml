name: ${COMPOSE_PROJECT_NAME:-mizan}

services:
  mizan:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=16m
    ports:
      - "${MIZAN_PUBLISH_HOST:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      MIZAN_BIND_HOST: "0.0.0.0"
      MIZAN_DB_PATH: /app/data/mizan.sqlite3
      MIZAN_JUDGE_TOKEN: "${MIZAN_JUDGE_TOKEN:?Run python3 scripts/bootstrap.py to create the owner token}"
      MIZAN_ENCRYPTION_KEY: "${MIZAN_ENCRYPTION_KEY:?Run python3 scripts/bootstrap.py to create the encryption key}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      META_API_BASE: "${META_API_BASE:-https://api.meta.ai/v1}"
      META_MODEL: "${META_MODEL:-muse-spark-1.3,muse-spark-1.1}"
      META_REASONING_EFFORT: "${META_REASONING_EFFORT:-}"
      MIZAN_ALLOWED_HOSTS: "${MIZAN_ALLOWED_HOSTS:-}"
      MIZAN_ALLOWED_ORIGINS: "${MIZAN_ALLOWED_ORIGINS:-}"
    volumes:
      - mizan-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('PORT', '8000'), timeout=2).read()"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  mizan-data:
