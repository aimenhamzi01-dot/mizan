<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ميزان · Mizan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#111B2E; --panel2:#0E1626; --line:#223049; --ink:#E7EDF6; --muted:#8C9BB5;
  --accent:#4FD1C5; --bad:#FF6B6B; --warn:#F2C572; --good:#6FCF97; --mono:"IBM Plex Mono",monospace;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--font)}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 56px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:6px}
h1{margin:0;font-size:clamp(1.5rem,4vw,2rem);font-weight:700;letter-spacing:.2px}
.tag{color:var(--accent);font-family:var(--mono);font-size:.85rem}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{all:unset;cursor:pointer;padding:6px 14px;font-size:.88rem;font-weight:500;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#06211F}
.lead{max-width:40em;color:var(--muted);margin:10px 0 22px}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.form .card{display:grid;gap:14px;margin-bottom:16px}
label.field{display:grid;gap:6px}
label.field span{font-size:.85rem;color:var(--muted);font-weight:600}
textarea{width:100%;resize:vertical;background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:400 .95rem/1.6 var(--font);unicode-bidi:plaintext}
textarea#report{min-height:150px}
textarea#code{min-height:110px;font-family:var(--mono);font-size:.85rem;direction:ltr;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:9px;font-weight:700;font-size:.95rem;border:1.5px solid var(--line)}
.btn.primary{background:var(--accent);color:#06211F;border-color:var(--accent)}
.btn.ghost{color:var(--ink)}
.btn.small{padding:7px 13px;font-size:.85rem;font-weight:500}
.btn[disabled]{opacity:.5;pointer-events:none}
.samples{display:flex;gap:8px;flex-wrap:wrap}

.status{padding:12px 16px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted);margin-bottom:16px}
.status.error{border-style:solid;border-color:var(--bad);color:var(--bad)}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}

.verdict{display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:center;margin-bottom:16px}
.pill{font-family:var(--mono);font-weight:700;font-size:.8rem;padding:6px 12px;border-radius:999px;border:1.5px solid;display:inline-block;white-space:nowrap}
.pill.accept{color:var(--good);border-color:var(--good)} .pill.reject{color:var(--bad);border-color:var(--bad)}
.pill.need-info{color:var(--warn);border-color:var(--warn)} .pill.duplicate{color:var(--muted);border-color:var(--line)}
.sev{font-family:var(--mono);font-size:.78rem;padding:4px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.sev.critical,.sev.high{color:var(--bad)} .sev.medium{color:var(--warn)} .sev.low,.sev.none{color:var(--muted)}
.vmeta{color:var(--muted);font-size:.9rem}
.grid2{display:grid;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.card h2{margin:0 0 8px;font-size:.95rem;font-weight:700;color:var(--ink)}
.card h2 .sub{color:var(--muted);font-weight:400;font-size:.82rem}
.muted{color:var(--muted)}
ul.plain{margin:0;padding:0 0 0 1.1em}
[dir=rtl] ul.plain{padding:0 1.1em 0 0}
ul.plain li{margin-bottom:4px}
.inj{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);border-radius:8px;padding:10px 12px}
.inj li{color:var(--bad);font-family:var(--mono);font-size:.84rem;unicode-bidi:plaintext}
.evid{font-family:var(--mono);font-size:.84rem;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;unicode-bidi:plaintext}
.reply{unicode-bidi:plaintext;white-space:pre-wrap}
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:"›";transition:transform .15s}
details.card[open] summary::before{transform:rotate(90deg)}
.metrics{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0;font-family:var(--mono)}
.metrics div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-align:center}
.metrics b{display:block;font-size:1.3rem;color:var(--accent)}
.metrics span{font-size:.72rem;color:var(--muted)}
footer.safety{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><div class="tag">Meta Global AI Developer Hackathon 2026</div></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
      <button type="button" data-lang="en" aria-pressed="true">English</button>
    </div>
  </header>
  <p class="lead" id="lead"></p>

  <div class="metrics" id="metrics"></div>

  <div class="form">
    <div class="card">
      <label class="field"><span id="lblReport"></span>
        <textarea id="report"></textarea>
      </label>
      <label class="field"><span id="lblCode"></span>
        <textarea id="code"></textarea>
      </label>
      <div class="row">
        <button class="btn primary" type="button" id="runBtn"></button>
        <span class="samples" id="samples"></span>
      </div>
    </div>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <div id="result" hidden></div>

  <footer class="safety" id="safety"></footer>
</div>

<script>
const T = {
  ar: {
    title: "ميزان", lead: "يحاكي عمل مهندس فرز البلاغات الأمنية: يقرأ البلاغ والكود المرفق، يكتشف محاولات حقن التعليمات داخل البلاغ، يتحقق من الادعاء منطقياً، ويقترح قراراً مع الأدلة. القرار النهائي دائماً بيد مهندس بشري.",
    lblReport: "نص البلاغ (كما أرسله الباحث، يُعامَل كبيانات غير موثوقة)",
    lblCode: "الكود ذو الصلة (اختياري، للتحقق من الادعاء)",
    run: "فرز البلاغ", running: "يقرأ ويتحقق",
    sInj: "مثال: محاولة حقن", sValid: "مثال: بلاغ صحيح", sNoise: "مثال: ضجيج",
    claim: "الادعاء", component: "المكوّن", impact: "الأثر المزعوم",
    repro: "خطوات إعادة الإنتاج", inj: "محاولات حقن تعليمات داخل البلاغ ⚠", injEmpty: "لم تُكتشف أي محاولة",
    code: "نتيجة التحقق من الكود", evid: "الدليل", reply: "مسودة الرد للباحث",
    none: "لا شيء", unspecified: "غير محدد",
    noise: {specific:"محدد", generic:"عام", "scanner-dump":"ناتج أداة خام"},
    verify: {supported:"مدعوم بالكود", unverifiable:"غير قابل للتحقق", contradicted:"يناقضه الكود"},
    decision: {accept:"قبول", "need-info":"طلب معلومات", duplicate:"مكرر", reject:"رفض"},
    sevNames: {none:"بلا خطورة", low:"منخفضة", medium:"متوسطة", high:"عالية", critical:"حرجة"},
    errNet: "تعذّر الاتصال بالخادم.", noKey: "لم يُضبط مفتاح Meta API في .env.",
    errGeneric: "حدث خطأ: ", needReport: "الصق نص البلاغ أولاً.",
    m1: "كشف حقن", m2: "استبعاد ضجيج", m3: "القرار النهائي دائماً بشري",
    safety: "ميزان أداة قراءة وتحليل فقط. لا يُشغّل أي كود أو استغلال، ولا يتصل بأي نظام خارجي. كل قرار هنا اقتراح تتم مراجعته من مهندس بشري قبل تطبيقه.",
  },
  en: {
    title: "Mizan", lead: "Mimics a security triage engineer: reads the report and any attached code, flags prompt-injection attempts hidden in the report, verifies the claim logically, and proposes a decision with evidence. The human engineer always makes the final call.",
    lblReport: "Report text (as the researcher sent it; treated as untrusted data)",
    lblCode: "Relevant code (optional, used to verify the claim)",
    run: "Triage report", running: "Reading and verifying",
    sInj: "Sample: injection attempt", sValid: "Sample: valid report", sNoise: "Sample: noise",
    claim: "Claim", component: "Component", impact: "Claimed impact",
    repro: "Reproduction steps", inj: "Prompt-injection attempts found in the report ⚠", injEmpty: "None detected",
    code: "Code verification", evid: "Evidence", reply: "Draft reply to the researcher",
    none: "None", unspecified: "Unspecified",
    noise: {specific:"Specific", generic:"Generic", "scanner-dump":"Raw scanner dump"},
    verify: {supported:"Supported by code", unverifiable:"Unverifiable", contradicted:"Contradicted by code"},
    decision: {accept:"Accept", "need-info":"Need info", duplicate:"Duplicate", reject:"Reject"},
    sevNames: {none:"None", low:"Low", medium:"Medium", high:"High", critical:"Critical"},
    errNet: "Couldn't reach the server.", noKey: "No Meta API key set in .env.",
    errGeneric: "Something went wrong: ", needReport: "Paste the report text first.",
    m1: "Catches injection", m2: "Filters noise", m3: "Final call always human",
    safety: "Mizan only reads and reasons. It never runs code or an exploit, and never contacts an external system. Every decision here is a proposal reviewed by a human engineer before it is applied.",
  }
};
const $ = id => document.getElementById(id);
let lang = "en";
const t = k => T[lang][k];

function setLang(l){
  lang = l;
  document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
  $("title").textContent=t("title"); $("lead").textContent=t("lead"); document.title=t("title");
  $("lblReport").textContent=t("lblReport"); $("lblCode").textContent=t("lblCode");
  $("runBtn").textContent = busy ? t("running")+"…" : t("run");
  $("safety").textContent = t("safety");
  renderMetrics();
  renderSamples();
  if (lastResult) renderResult(lastResult);
}
function renderMetrics(){
  $("metrics").innerHTML = "";
  [["🛡️","m1"],["🧹","m2"],["🧑‍⚖️","m3"]].forEach(([icon,k])=>{
    const d=document.createElement("div"); d.innerHTML = "<b>"+icon+"</b><span>"+t(k)+"</span>"; $("metrics").append(d);
  });
}
function renderSamples(){
  const box = $("samples"); box.innerHTML = "";
  [["injection","sInj"],["valid","sValid"],["noise","sNoise"]].forEach(([kind,label])=>{
    const b=document.createElement("button"); b.type="button"; b.className="btn ghost small"; b.textContent=t(label);
    b.addEventListener("click", ()=>loadSample(kind)); box.append(b);
  });
}

let busy=false, lastResult=null, lastDemoKind=null;
function setBusy(v){ busy=v; $("runBtn").disabled=v; $("runBtn").textContent = v ? t("running")+"…" : t("run"); }
function showStatus(msg,isError,dots){
  const s=$("status"); s.hidden=!msg; s.className="status"+(isError?" error":"");
  s.textContent=msg||""; if(dots){const d=document.createElement("span");d.className="dots";s.appendChild(d);}
}

async function post(path, body){
  let r;
  try { r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)}); }
  catch { throw new Error(t("errNet")); }
  let data={}; try{ data = await r.json(); }catch{}
  if(!r.ok) throw new Error(r.status===401 ? t("noKey") : t("errGeneric")+(data.error||r.status));
  return data;
}
async function loadSample(kind){
  try {
    const r = await fetch("/api/sample?kind="+kind+"&lang="+lang);
    const d = await r.json();
    $("report").value = d.report||""; $("code").value = d.code||"";
    lastDemoKind = kind;
  } catch { showStatus(t("errNet"), true); }
}
async function run(){
  const report = $("report").value.trim();
  if(!report){ showStatus(t("needReport"), true); return; }
  setBusy(true); $("result").hidden=true; showStatus(t("running"), false, true);
  try {
    const body = {report, code: $("code").value, lang};
    const r = await post("/api/triage", lastDemoKind ? Object.assign(body,{demo:lastDemoKind}) : body);
    lastResult = r; showStatus(""); renderResult(r);
  } catch(e){ showStatus(e.message, true); }
  finally { setBusy(false); }
}
// if the user edits text after loading a sample, fall back to live mode
["report","code"].forEach(id => $(id).addEventListener("input", ()=>{ lastDemoKind=null; }));

function h(tag, props={}, ...kids){
  const n=document.createElement(tag);
  for(const k in props){ if(k==="class") n.className=props[k]; else if(k.startsWith("on")) n.addEventListener(k.slice(2),props[k]); else n.setAttribute(k,props[k]); }
  kids.flat().forEach(c=>n.append(c)); return n;
}
function renderResult(r){
  const root=$("result"); root.replaceChildren(); root.hidden=false;

  const v = h("div",{class:"verdict"},
    h("span",{class:"pill "+r.decision}, t("decision")[r.decision] || r.decision),
    h("span",{class:"vmeta"}, r.component || t("unspecified")));
  v.append(h("span",{class:"sev "+r.severity}, (t("sevNames")[r.severity]||r.severity)));
  v.lastChild.before(" ");
  root.append(v);

  const grid = h("div",{class:"grid2"});
  const left = h("div",{class:"card"},
    h("h2",{},t("claim")), h("p",{}, r.claim || t("none")),
    h("h2",{style:"margin-top:14px"},t("impact")), h("p",{}, r.claimed_impact || t("none")));
  if (r.repro_steps.length){
    left.append(h("h2",{style:"margin-top:14px"},t("repro")),
      h("ul",{class:"plain"}, r.repro_steps.map(s=>h("li",{},s))));
  }
  grid.append(left);

  const right = h("div",{class:"card"},
    h("h2",{}, t("code"), " ", h("span",{class:"sub"}, t("verify")[r.code_verification]||r.code_verification)));
  if (r.code_evidence) right.append(h("div",{class:"evid"}, r.code_evidence));
  right.append(h("h2",{style:"margin-top:14px"}, t("evid")+" / "+(T[lang].noise[r.noise]||r.noise)));
  right.append(h("p",{class:"muted"}, r.severity_reasoning || r.decision_reasoning || ""));
  grid.append(right);
  root.append(grid);

  const injCard = h("div",{class:"card inj", style:"margin-top:14px"}, h("h2",{style:"color:var(--bad)"}, t("inj")));
  if (r.injection_attempts.length) injCard.append(h("ul",{class:"plain"}, r.injection_attempts.map(s=>h("li",{},"“"+s+"”"))));
  else injCard.append(h("p",{class:"muted"}, t("injEmpty")));
  root.append(injCard);

  root.append(h("details",{class:"card", style:"margin-top:14px", open:""},
    h("summary",{}, t("reply")),
    h("p",{class:"reply", style:"margin-top:10px"}, r.draft_reply || "")));

  root.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth", block:"start"});
}

document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("runBtn").addEventListener("click", run);
setLang(lang);
</script>
</body>
</html>
